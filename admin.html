<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin | Vivaan Dashboard</title>
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <div class="admin-container">
        <div class="admin-card">
            <h1>
                <div class="live-dot"></div> Live Dashboard
            </h1>

            <div id="login-section">
                <div class="input-group">
                    <label>Admin Password</label>
                    <input type="password" id="password" placeholder="Enter password..." autocomplete="current-password">
                </div>
                <button type="button" id="login-btn">Secure Login</button>
            </div>

            <div id="edit-section" hidden>
                <div class="input-group">
                    <label>Peak Output (%)</label>
                    <input type="number" id="peakOutput" value="99" min="0" max="100" inputmode="numeric">
                </div>

                <div class="input-group">
                    <label>Explosive Power (%)</label>
                    <input type="number" id="explosivePower" value="96" min="0" max="100" inputmode="numeric">
                </div>

                <div class="input-group">
                    <label>Endurance Base (%)</label>
                    <input type="number" id="enduranceBase" value="88" min="0" max="100" inputmode="numeric">
                </div>

                <div class="input-group">
                    <label>Agility & Reaction (%)</label>
                    <input type="number" id="agilityReaction" value="94" min="0" max="100" inputmode="numeric">
                </div>

                <div class="input-group">
                    <label>Pace PR</label>
                    <input type="text" id="pacePr" value="4:20/km" maxlength="32" autocomplete="off">
                </div>

                <div class="input-group">
                    <label>VO2 Max</label>
                    <input type="text" id="vo2Max" value="50.2" maxlength="24" autocomplete="off">
                </div>

                <div class="input-group">
                    <label>Age Group</label>
                    <input type="text" id="ageGroup" value="14 yrs" maxlength="48" autocomplete="off">
                </div>

                <button type="button" id="save-btn">Push to Live Website</button>
                <p id="status-msg">✓ Updated Successfully!</p>
            </div>
        </div>
    </div>

    <script src="trusted-types.js"></script>
    <script type="module" src="admin.js"></script>
</body>

</html>
